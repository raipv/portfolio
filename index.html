<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title id="pageTitle">Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div id="photoPopup" class="popup" aria-hidden="true">
        <img
          id="popupImage"
          class="popup-image"
          alt="Profile Photo"
          onclick="event.stopPropagation()"
        />
      </div>

      <div class="profile-container">
        <img
          id="profileImage"
          alt="Profile Photo"
          class="profile-photo"
          onclick="openPhoto()"
        />
      </div>

      <h1
        id="name"
        style="
          font-size: 40px;
          font-weight: 900;
          color: #0077cc;
          letter-spacing: 3px;
          margin-bottom: 5px;
        "
      ></h1>

      <p id="title"></p>
      <nav>
        <a href="#about">About</a> | <a href="#skills">Skills</a> |
        <a href="#projects">Projects</a> |
        <a href="#contact">Contact</a>
      </nav>

      <button
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
      >
        🌙
      </button>

      <hr />
    </header>

    <main>
      <section id="about">
        <h2>About</h2>
        <article class="project">
          <p id="aboutText"></p>
        </article>
      </section>

      <section id="skills">
        <h2>Skills</h2>
        <article class="project">
          <ul id="skillsList"></ul>
        </article>
      </section>

      <section id="projects">
        <h2>Projects</h2>
        <div id="projectsList"></div>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <article class="project">
          <p>Email: <a id="emailLink" href=""></a></p>
          <p>
            GitHub: <a id="githubLink" href="" target="_blank">link</a>
          </p>
        </article>
      </section>

      <div class="feedback-box">
        <p class="feedback-title">Rate my Portfolio:</p>

        <div class="star-rating">
          <i class="star" data-value="1">★</i>
          <i class="star" data-value="2">★</i>
          <i class="star" data-value="3">★</i>
          <i class="star" data-value="4">★</i>
          <i class="star" data-value="5">★</i>
        </div>

        <p id="ratingResult" class="feedback-result"></p>
      </div>
    </main>

    <footer>
      <hr />
      <small>© <span id="year"></span> <span id="footerName"></span></small>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
   
   <script>
      // Wait for the DOM to load, and wait a tiny bit for the JSON data to render
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const fadeElements = document.querySelectorAll('.fade-in');

          const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15 // Triggers when 15% of the element is visible
          };

          const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                // Optional: Stop observing once it's visible so it doesn't animate again when scrolling up
                observer.unobserve(entry.target); 
              }
            });
          }, observerOptions);

          fadeElements.forEach(el => observer.observe(el));
        }, 100); // 100ms delay ensures the JSON data has populated the DOM
      });
    </script>

    <script>
      async function loadPortfolioData() {
        try {
          const response = await fetch('data.json');
          const data = await response.json();

          // Update Document Title (Browser Tab)
          document.title = `${data.name} — Portfolio`;

          // Update Images
          document.getElementById('popupImage').src = data.profileImage;
          document.getElementById('profileImage').src = data.profileImage;

          // Update Name, Title, and Footer Name
          document.getElementById('name').textContent = data.name;
          document.getElementById('title').textContent = data.title;
          document.getElementById('footerName').textContent = data.name;

          // Update About Section
          document.getElementById('aboutText').textContent = data.about.text;

          // Update Skills
          const skillsList = document.getElementById('skillsList');
          skillsList.innerHTML = '';
          data.skills.forEach(skill => {
            const li = document.createElement('li');
            li.textContent = skill;
            skillsList.appendChild(li);
          });

          // Update Projects
          const projectsList = document.getElementById('projectsList');
          projectsList.innerHTML = '';
          data.projects.forEach(project => {
            const article = document.createElement('article');
            article.className = 'project';

            const h3 = document.createElement('h3');
            h3.textContent = project.title;

            const p = document.createElement('p');
            p.textContent = project.description;

            const ul = document.createElement('ul');
            project.responsibilities.forEach(resp => {
              const li = document.createElement('li');
              li.textContent = resp;
              ul.appendChild(li);
            });

            article.appendChild(h3);
            article.appendChild(p);
            article.appendChild(ul);
            projectsList.appendChild(article);
          });

          // Update Contact
          const emailLink = document.getElementById('emailLink');
          emailLink.textContent = data.contact.email;
          emailLink.href = 'mailto:' + data.contact.email;

          const githubLink = document.getElementById('githubLink');
          githubLink.href = data.contact.github;
        } catch (error) {
          console.error('Error loading portfolio data:', error);
        }
      }

      // Load data when page loads
      document.addEventListener('DOMContentLoaded', loadPortfolioData);
    </script>

    <script>
      function openPhoto() {
        const popup = document.getElementById('photoPopup');
        popup.style.display = 'flex';
        popup.setAttribute('aria-hidden', 'false');
      }

      document
        .getElementById('photoPopup')
        .addEventListener('click', function () {
          this.style.display = 'none';
          this.setAttribute('aria-hidden', 'true');
        });

      // Close popup when user scrolls
      window.addEventListener('scroll', function () {
        const popup = document.getElementById('photoPopup');
        if (popup.style.display === 'flex') {
          popup.style.display = 'none';
          popup.setAttribute('aria-hidden', 'true');
        }
      });
    </script>

    <script>
      const toggleBtn = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme');

      if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️';
      }

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');

        if (document.body.classList.contains('dark-mode')) {
          toggleBtn.textContent = '☀️';
          localStorage.setItem('theme', 'dark');
        } else {
          toggleBtn.textContent = '🌙';
          localStorage.setItem('theme', 'light');
        }
      });
    </script>
    <script>
      // Star rating logic (click / tap only)
      const stars = document.querySelectorAll('.feedback-box .star');
      const ratingResult = document.getElementById('ratingResult');
      let selectedRating = 0;

      stars.forEach((star) => {
        star.addEventListener('click', () => {
          const value = parseInt(star.dataset.value);
          selectedRating = value;
          highlightStars(selectedRating);
          // ratingResult.textContent = `You rated: ${selectedRating} / 5 ⭐`;
        });
      });

      function highlightStars(count) {
        stars.forEach((s) => {
          const starValue = parseInt(s.dataset.value);
          s.classList.toggle('selected', starValue <= count);
        });
      }
    </script>
  </body>
</html>
